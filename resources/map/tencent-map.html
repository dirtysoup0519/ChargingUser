<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body,#map{margin:0;width:100%;height:100%;overflow:hidden}#error{display:none;padding:16px;color:#a33;font:14px sans-serif}</style>
<script src="https://map.qq.com/api/gljs?v=1.exp&key=__TENCENT_KEY__"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script></head>
<body><div id="map"></div><div id="error"></div>
<script>
let bridge=null,map=null,markers=[],routeLine=null;
function fail(message){document.getElementById('error').textContent=message;document.getElementById('error').style.display='block';if(bridge)bridge.reportLoadFailed(message)}
function render(snapshot){if(!map||!snapshot)return; markers.forEach(m=>m.setMap(null));markers=[]; (snapshot.markers||[]).forEach(item=>{if(!Number.isFinite(item.latitude)||!Number.isFinite(item.longitude))return;const marker=new TMap.MultiMarker({map,styles:{default:{width:32,height:32,anchor:{x:16,y:32}}},geometries:[{position:new TMap.LatLng(item.latitude,item.longitude),id:item.stationId}]});marker.on('click',()=>bridge&&bridge.selectStation(item.stationId));markers.push(marker)});if(routeLine)routeLine.setMap(null);const path=(snapshot.routePolyline||[]).filter(p=>Number.isFinite(p.latitude)&&Number.isFinite(p.longitude)).map(p=>new TMap.LatLng(p.latitude,p.longitude));if(path.length>1)routeLine=new TMap.MultiPolyline({map,styles:{polyline:{color:'#1976d2',width:6}},geometries:[{id:'route',paths:path}]})}
new QWebChannel(qt.webChannelTransport,channel=>{bridge=channel.objects.tencentMapBridge;bridge.snapshotChanged.connect(render);try{map=new TMap.Map('map',{zoom:12,center:new TMap.LatLng(22.5431,114.0579)});bridge.reportReady();}catch(e){fail(String(e))}});
</script></body></html>
